name: Quantum Neural Network Pqc CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[server,test]"

    - name: Check critical Python lint rules
      run: |
        python -m pip install ruff
        ruff check --select E9,F63,F7,F82 .

    - name: Python syntax checks
      run: python -m compileall -q agents qnn_pqc_agent cli.py enrichment.py simulator.py tests

    - name: Run Pytest Suite
      run: python -m pytest -q

    - name: Verify browser evaluation
      run: node --test tests/test_browser.cjs

    - name: Security SAST & Zero-PHI Audit
      run: |
        python -c "
        from agents.base import PHIGuard, AuditLogger
        import pytest
        assert AuditLogger.verify_integrity() is True
        print('Security & Zero-PHI Audit Passed!')
        "
