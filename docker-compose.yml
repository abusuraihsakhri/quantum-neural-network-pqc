version: '3.8'

services:
  quantum-neural-network-pqc:
    build: .
    container_name: quantum-neural-network-pqc
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-please-set-a-secure-random-key-in-production}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
