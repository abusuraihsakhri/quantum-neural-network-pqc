[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-neural-network-pqc"
version = "2.0.0"
description = "Parameterized Quantum Circuit (PQC) Quantum Neural Network Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
quantum-neural-network-pqc = "qnn_pqc_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-neural-network-pqc"
Repository = "https://github.com/abusuraihsakhri/quantum-neural-network-pqc.git"
